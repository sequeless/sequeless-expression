sonar.projectKey=sequeless-expression
sonar.organization=sequeless
sonar.host.url=https://sonarcloud.io

# Source/test layout is discovered from the Maven reactor; these tune analysis scope.
sonar.exclusions=**/generated/**,**/target/**
sonar.coverage.exclusions=**/*Application.java,**/config/**,**/package-info.java

# JaCoCo XML report per module.
sonar.coverage.jacoco.xmlReportPaths=expression-api/target/site/jacoco/jacoco.xml,expression-testkit/target/site/jacoco/jacoco.xml,expression-jexl-adapter/target/site/jacoco/jacoco.xml,expression-spring-boot-autoconfig/target/site/jacoco/jacoco.xml
